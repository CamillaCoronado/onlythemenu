name: pipeline
on:
  schedule: [{ cron: '17 9 * * *' }] # daily; run.ts only refetches sources older than a week
  workflow_dispatch:
    inputs:
      restaurant: { description: 'restaurantId to run now (optional)', required: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: pipeline
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsx pipeline/run.ts ${{ inputs.restaurant }}
